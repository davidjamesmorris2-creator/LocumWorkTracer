<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift &amp; Pay Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#0f766e;--ac2:#e6f4f2;--bd:#e3e6ea;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#f4f6f8;--mu:#c3cad4;--ac:#5eead4;--ac2:#2a4a45;--bd:#2c333b;--bad:#f97066;--ok:#47cd89}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#f4f6f8;--mu:#c3cad4;--ac:#5eead4;--ac2:#2a4a45;--bd:#2c333b;--bad:#f97066;--ok:#47cd89}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:14px}.big{font-size:22px;font-weight:700}
.bad{color:var(--bad)}.ok{color:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:22px;height:22px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) main button:not(.g):not(.x){color:#042f2b}}
:root[data-theme="dark"] main button:not(.g):not(.x){color:#042f2b}
button.g{background:var(--ac2);color:var(--tx)}button.x{background:var(--card);border:2px solid var(--bad);color:var(--bad);padding:10px 14px;min-width:52px;min-height:48px;font-size:18px}button.x.on{background:var(--bad);color:#fff;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal b{font-size:12px;color:var(--mu);font-weight:600}
.cal button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:4px 0;min-height:48px;border-radius:8px;font-weight:500;font-size:15px;line-height:1.15}
.cal button.has{background:var(--ac2);font-weight:700}.cal button.sel{outline:3px solid var(--ac)}.cal button.tdy{border-color:var(--ac)}.cal small{display:block;font-size:10px;color:var(--mu)}.cal button.e{visibility:hidden}
button.full{width:100%;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:13px}
nav button.on{color:var(--ac)}
.col{flex:1;min-width:110px}.ded{display:grid;grid-template-columns:28px 1fr 90px;gap:8px;align-items:center;margin-top:6px}
.tag{font-size:12px;background:var(--ac2);color:var(--tx);padding:2px 8px;border-radius:99px}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
var K='dentalpay1',db=load(),tab='sum',edit=null,pend=[],calM=today().slice(0,7),selDay=null,armed=null,tm=null,notice='';
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.offices)return d}catch(e){}return{offices:[],shifts:[],pays:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function m(n){return(n<0?'-':'')+'$'+Math.abs(n).toFixed(2)}
function today(){return new Date().toLocaleDateString('en-CA')}
function off(id){return db.offices.find(function(o){return o.id===id})}
function wageOn(o,d){var w=+o.wage,best='';(o.raises||[]).forEach(function(r){if(r.date<=d&&r.date>=best){best=r.date;w=+r.wage}});return w}
function dedPct(o){return(o.deds||[]).reduce(function(a,d){return a+(d.on?+d.rate:0)},0)}
function gross(s){var o=off(s.office);return o?hw(s)*wageOn(o,s.date)*(1+(+o.vac||0)/100):0}
function net(s){var o=off(s.office);return o?gross(s)*(1-dedPct(o)/100):0}
function fd(d){return new Date(d+'T12:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}
var PT={biweekly:'Paid biweekly',office:'Cheque in office',cash:'Cash (no deductions)'};
function setTab(t){tab=t;edit=null;render()}
function render(){
 var t={sum:'Summary',shifts:'Shifts',pay:'Payments',off:'Offices'};
 $('nav').innerHTML=Object.keys(t).map(function(k){return'<button class="'+(k===tab?'on':'')+'" onclick="setTab(\''+k+'\')">'+t[k]+'</button>'}).join('');
 $('app').innerHTML=({sum:vSum,shifts:vShifts,pay:vPay,off:vOff})[tab]();
}
function noOff(){return'<div class="card">Add your first office on the <b>Offices</b> tab to get started.</div>'}
function vSum(){
 if(!db.offices.length)return'<h1>Summary</h1>'+noOff();
 var td=today(),tot=0,h='<h1>Summary</h1>';
 db.offices.forEach(function(o){
  var w=db.shifts.filter(function(s){return s.office===o.id&&s.date<=td});
  var hrs=w.reduce(function(a,s){return a+hw(s)},0),g=w.reduce(function(a,s){return a+gross(s)},0),n=w.reduce(function(a,s){return a+net(s)},0);
  var rec=db.pays.filter(function(p){return p.office===o.id}).reduce(function(a,p){return a+ +p.amt},0),out=n-rec;tot+=out;
  var up=db.shifts.filter(function(s){return s.office===o.id&&s.date>td}).length;
  h+='<div class="card" style="'+tint(o.id)+'"><div class="row sp"><b>'+esc(o.name)+'</b><span class="tag">'+PT[o.pay]+'</span></div>'+
  '<div class="row sp" style="margin-top:8px"><div><div class="mu">Still owed</div><div class="big '+(out>0.005?'bad':'ok')+'">'+m(out)+'</div></div>'+
  '<div class="mu" style="text-align:right">'+(Math.round(hrs*100)/100)+' h worked<br>Gross '+m(g)+'<br>Expected net '+m(n)+'<br>Received '+m(rec)+'<br>'+up+' upcoming shifts</div></div></div>';
 });
 return h+'<div class="card row sp"><b>Total outstanding</b><span class="big '+(tot>0.005?'bad':'ok')+'">'+m(tot)+'</span></div><p class="mu">Net amounts are estimates from the deduction rates set for each office. Past-dated shifts count as worked.</p>';
}
function vShifts(){
 if(!db.offices.length)return'<h1>Shifts</h1>'+noOff();
 var td=today(),h='<h1>Shifts</h1><div class="card"><label>Office</label><select id="so">'+db.offices.map(function(o){return'<option value="'+o.id+'">'+esc(o.name)+'</option>'}).join('')+'</select>'+
 '<div class="row"><div class="col"><label>Date</label><input type="date" id="sd" value="'+td+'"></div><div class="col"><label>Start</label><input type="time" id="st" value="09:00"></div><div class="col"><label>End</label><input type="time" id="et" value="16:00"></div></div>'+
 '<button class="g full" onclick="addPend()">+ Add to list</button>';
 if(pend.length){h+='<h2>Ready to save ('+pend.length+')</h2>'+pend.map(function(p,i){return'<div class="row sp"><span>'+fd(p.date)+' · '+p.hours+' h · '+esc((off(p.office)||{}).name||'')+'</span><button class="x" onclick="pend.splice('+i+',1);render()">✕</button></div>'}).join('')+'<button class="full" onclick="savePend()">Save all shifts</button>'}
 h+='</div>';
 var up=db.shifts.filter(function(s){return s.date>td}).sort(function(a,b){return a.date<b.date?-1:1});
 var past=db.shifts.filter(function(s){return s.date<=td}).sort(function(a,b){return a.date<b.date?1:-1});
 return h+calHTML()+(selDay?'<h2>'+fd(selDay)+'</h2>'+(db.shifts.filter(function(s){return s.date===selDay}).map(sRow).join('')||'<p class="mu">No shifts this day.</p>'):'')+'<h2>Upcoming</h2>'+(up.length?'<button class="g full" style="margin:0 0 8px" onclick="calUp()">📅 Add upcoming shifts to Apple Calendar</button>':'')+(up.map(sRow).join('')||'<p class="mu">None scheduled.</p>')+'<h2>Worked</h2>'+(past.map(sRow).join('')||'<p class="mu">None yet.</p>');
}
function sRow(s){var o=off(s.office)||{name:'?'};return'<div class="card row sp" style="'+tint(s.office)+'"><div><b>'+fd(s.date)+'</b> · '+s.hours+' h · '+(s.start||'09:00')+'<div class="mu">'+esc(o.name)+' · '+m(gross(s))+' gross · '+m(net(s))+' net</div></div>'+'<div class="row"><button class="g" style="min-height:48px;font-size:18px" onclick="calOne(\''+s.id+'\')">📅</button>'+xb('s',s.id)+'</div>'+'<input style="flex-basis:100%" placeholder="Tap to add a comment…" value="'+esc(s.note||'')+'" onchange="setNote(\''+s.id+'\',this.value)"></div>'}
function addPend(){var st=$('st').value||'09:00',d=$('sd').value,h=parseFloat($('sh').value),o=$('so').value;if(!d||!(h>0))return;pend.push({office:o,date:d,hours:h,start:st});var dt=new Date(d+'T12:00');dt.setDate(dt.getDate()+1);render();$('sd').value=dt.toLocaleDateString('en-CA');$('so').value=o;$('st').value=st}
function savePend(){pend.forEach(function(p){p.id=uid();db.shifts.push(p)});pend=[];save();render()}
function setNote(id,v){var s=db.shifts.find(function(x){return x.id===id});if(s){s.note=v;save()}}
function p2(n){return(n<10?'0':'')+n}
function ic(d){return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00'}
function calUp(){
 var td=today(),up=db.shifts.filter(function(s){return s.date>td});if(!up.length)return;
 var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ShiftTracker//EN'],now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 up.forEach(function(s){var o=off(s.office)||{name:'Work'},a=new Date(s.date+'T'+(s.start||'09:00')),b=new Date(a.getTime()+s.hours*3600000);
  L.push('BEGIN:VEVENT','UID:'+s.id+'@shifttracker','DTSTAMP:'+now,'DTSTART:'+ic(a),'DTEND:'+ic(b),'SUMMARY:Work – '+o.name.replace(/[,;]/g,' '),'END:VEVENT')});
 L.push('END:VCALENDAR');
 var f=new File([L.join('\r\n')],'shifts.ics',{type:'text/calendar'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Work shifts'}).catch(function(){})}
 else notify('This view can’t hand a calendar file to your phone. Tell Claude in chat the dates, hours and office and it will add them to your Calendar directly.');
}
function notify(t){notice=t;render()}
function xb(k,id){var a=armed===k+id;return'<button class="x'+(a?' on':'')+'" onclick="del(\''+k+'\',\''+id+'\')">'+(a?'Delete?':'✕')+'</button>'}
function del(k,id){var key=k+id;if(armed!==key){armed=key;render();clearTimeout(tm);tm=setTimeout(function(){if(armed===key){armed=null;render()}},4000);return}
 armed=null;if(k==='s')db.shifts=db.shifts.filter(function(s){return s.id!==id});else db.pays=db.pays.filter(function(p){return p.id!==id});save();render()}
function mv(n){var y=+calM.slice(0,4),mo=+calM.slice(5)-1,d=new Date(y,mo+n,1);calM=d.getFullYear()+'-'+p2(d.getMonth()+1);render()}
function pickDay(ds){var o=$('so').value;selDay=selDay===ds?null:ds;render();$('so').value=o;if(selDay)$('sd').value=ds}
function calHTML(){
 var y=+calM.slice(0,4),mo=+calM.slice(5)-1,first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate(),td=today();
 var ms=db.shifts.filter(function(s){return s.date.slice(0,7)===calM}),mh=Math.round(ms.reduce(function(a,s){return a+hw(s)},0)*100)/100;
 var h=(notice?'<div class="card">'+esc(notice)+'</div>':'')+'<div class="card"><div class="row sp"><button class="g" style="min-width:56px;font-size:20px" onclick="mv(-1)">‹</button><b>'+first.toLocaleDateString('en-CA',{month:'long',year:'numeric'})+'</b><button class="g" style="min-width:56px;font-size:20px" onclick="mv(1)">›</button></div><div class="cal" style="margin-top:8px">'+'SMTWTFS'.split('').map(function(c){return'<b>'+c+'</b>'}).join('');
 for(var i=0;i<first.getDay();i++)h+='<button class="g e"></button>';
 for(var d=1;d<=n;d++){var ds=calM+'-'+p2(d),dl=db.shifts.filter(function(s){return s.date===ds}),hr=dl.reduce(function(a,s){return a+hw(s)},0);
  h+='<button class="g'+(hr?' has':'')+(ds===selDay?' sel':'')+(ds===td?' tdy':'')+'" style="'+dayBg(dl)+'" onclick="pickDay(\''+ds+'\')">'+d+dayTxt(dl)+'</button>'}
 return h+'</div>'+legend()+'<div class="mu" style="margin-top:8px">'+ms.length+' shifts · '+mh+' h this month. Tap a day to see or add shifts.</div></div>'}
function vPay(){
 if(!db.offices.length)return'<h1>Payments</h1>'+noOff();
 var h='<h1>Payments</h1><div class="card"><label>Office</label><select id="po">'+db.offices.map(function(o){return'<option value="'+o.id+'">'+esc(o.name)+'</option>'}).join('')+'</select>'+
 '<div class="row"><div class="col"><label>Date received</label><input type="date" id="pd" value="'+today()+'"></div><div class="col"><label>Amount ($)</label><input type="number" id="pa" step="0.01" inputmode="decimal"></div></div>'+
 '<label>Note (optional)</label><input id="pn" placeholder="e.g. cheque #, pay period"><button class="full" onclick="addPay()">Save payment</button></div>';
 var l=db.pays.slice().sort(function(a,b){return a.date<b.date?1:-1});
 return h+'<h2>History</h2>'+(l.map(function(p){return'<div class="card row sp"><div><b>'+m(+p.amt)+'</b> · '+fd(p.date)+'<div class="mu">'+esc((off(p.office)||{name:'?'}).name)+(p.note?' · '+esc(p.note):'')+'</div></div>'+xb('p',p.id)+'</div>'}).join('')||'<p class="mu">No payments logged.</p>');
}
function addPay(){var a=parseFloat($('pa').value);if(!(a>0))return;db.pays.push({id:uid(),office:$('po').value,date:$('pd').value,amt:a,note:$('pn').value});save();render()}

function vOff(){
 if(edit)return offForm();
 return'<h1>Offices</h1>'+db.offices.map(function(o){return'<div class="card row sp" style="'+tint(o.id)+'" onclick="edit=\''+o.id+'\';render()"><div><b>'+esc(o.name)+'</b><div class="mu">'+m(wageOn(o,today()))+'/h · '+PT[o.pay]+' · '+dedPct(o)+'% deducted</div></div><span class="mu">Edit ›</span></div>'}).join('')+'<button class="full" onclick="newOff()">+ Add office</button>';
}
function newOff(){var o={id:uid(),name:'',wage:'',pay:'biweekly',raises:[],deds:[{n:'Income tax (fed + BC)',rate:15,on:true},{n:'CPP',rate:5.95,on:true},{n:'EI',rate:1.63,on:true},{n:'',rate:0,on:false}],isNew:true};db.offices.push(o);edit=o.id;render()}
function offForm(){
 var o=off(edit);
 var h='<h1>'+(o.isNew?'New office':'Edit office')+'</h1><div class="card"><label>Office name</label><input id="on" value="'+esc(o.name)+'">'+
 '<label>Hourly wage ($)</label><input id="ow" type="number" step="0.01" inputmode="decimal" value="'+o.wage+'">'+
 '<label>Vacation pay (% added on top of wage, 0 if none)</label><input id="ov" type="number" step="0.01" inputmode="decimal" placeholder="e.g. 4" value="'+(o.vac||'')+'"><label>How she is paid</label><select id="op" onchange="payChg()">'+Object.keys(PT).map(function(k){return'<option value="'+k+'"'+(k===o.pay?' selected':'')+'>'+PT[k]+'</option>'}).join('')+'</select>'+
 '<div class="row" style="margin-top:12px;flex-wrap:nowrap"><input type="checkbox" id="ps"'+(o.perShift?' checked':'')+'><span>Paid per shift (each shift gets its own payment)</span></div><label>Office colour</label>'+swHTML(o)+'<div style="display:none"><label>Pay period</label><select id="pp">'+[['biweekly','Every 2 weeks'],['weekly','Every week'],['monthly','Once a month']].map(function(x){return'<option value="'+x[0]+'"'+(x[0]===(o.per||'biweekly')?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select><label>A date a pay period started (any past one, not needed for monthly)</label><input type="date" id="pa0" value="'+(o.anchor||'')+'"></div>'+
 '<h2>Deductions taken off</h2><div class="mu">Tick what this office removes and adjust the %. Check her pay stub for the real rates.</div>';
 o.deds.forEach(function(d,i){h+='<div class="ded"><input type="checkbox" id="dc'+i+'"'+(d.on?' checked':'')+'>'+(i<3?'<span>'+esc(d.n)+'</span>':'<input id="dn'+i+'" placeholder="Other (e.g. benefits)" value="'+esc(d.n)+'">')+'<input id="dr'+i+'" type="number" step="0.01" value="'+d.rate+'" inputmode="decimal"></div>'});
 h+='</div>';
 if(!o.isNew){h+='<div class="card"><b>Pay raises</b>'+(o.raises||[]).map(function(r,i){return'<div class="row sp"><span>'+fd(r.date)+' → '+m(+r.wage)+'/h</span><button class="x" onclick="delRaise('+i+')">✕</button></div>'}).join('')+
  '<div class="row"><div class="col"><label>Effective date</label><input type="date" id="rd" value="'+today()+'"></div><div class="col"><label>New wage</label><input id="rw" type="number" step="0.01" inputmode="decimal"></div></div><button class="g full" onclick="addRaise()">+ Add raise</button></div>'}
 h+='<button class="full" onclick="saveOff()">Save office</button><button class="g full" onclick="cancelOff()">Cancel</button>';
 if(!o.isNew)h+='<button class="x full" onclick="if(this.dataset.a){delOff()}else{this.dataset.a=1;this.textContent=\'Tap again to confirm delete\'}">Delete office and its data</button>';
 return h;
}
function payChg(){if($('op').value==='cash'){off(edit).deds.forEach(function(_,i){$('dc'+i).checked=false})}}
function collect(){var o=off(edit);o.name=$('on').value.trim()||'Office';o.wage=parseFloat($('ow').value)||0;o.color=$('oc').value;o.perShift=$('ps').checked;o.vac=parseFloat($('ov').value)||0;o.pay=$('op').value;o.per=$('pp').value;o.anchor=$('pa0').value;o.deds.forEach(function(d,i){d.on=$('dc'+i).checked;d.rate=parseFloat($('dr'+i).value)||0;if(i>=3)d.n=$('dn'+i).value})}
function saveOff(){collect();delete off(edit).isNew;save();edit=null;render()}
function cancelOff(){var o=off(edit);if(o&&o.isNew)db.offices=db.offices.filter(function(x){return x!==o});edit=null;render()}
function addRaise(){var w=parseFloat($('rw').value);if(!(w>0))return;collect();var o=off(edit);o.raises.push({date:$('rd').value,wage:w});save();render()}
function delRaise(i){collect();off(edit).raises.splice(i,1);save();render()}
function delOff(){{var id=edit;db.offices=db.offices.filter(function(o){return o.id!==id});db.shifts=db.shifts.filter(function(s){return s.office!==id});db.pays=db.pays.filter(function(p){return p.office!==id});save();edit=null;render()}}
function d2n(s){var a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])/864e5}
function n2d(n){return new Date(n*864e5).toISOString().slice(0,10)}
function short(d){return new Date(d+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})}
function perOf(o,date){var p=o.per||'biweekly';if(p==='monthly'){return{s:date.slice(0,7)+'-01',e:n2d(Date.UTC(+date.slice(0,4),+date.slice(5,7),0)/864e5)}}
 var len=p==='weekly'?7:14,a=d2n(o.anchor||'2024-01-01'),k=Math.floor((d2n(date)-a)/len);return{s:n2d(a+k*len),e:n2d(a+k*len+len-1)}}
function vPay(){
 if(!db.offices.length)return'<h1>Pay periods</h1>'+noOff();
 var td=today(),h='<h1>Pay periods</h1><p class="mu">Shifts drop into pay periods automatically. Tap Paid when the money arrives (change the amount if it differs).</p>';
 db.offices.forEach(function(o){
  var per={};db.shifts.filter(function(s){return s.office===o.id&&s.date<=td}).forEach(function(s){var p=perOf(o,s.date),r=per[p.s]=per[p.s]||{p:p,n:0,hrs:0,net:0};r.n++;r.hrs+=s.hours;r.net+=net(s)});
  var keys=Object.keys(per).sort().reverse();h+='<h2>'+esc(o.name)+'</h2>';
  if(!keys.length){h+='<p class="mu">No worked shifts yet.</p>';return}
  keys.forEach(function(k){var r=per[k],got=db.pays.filter(function(p){return p.office===o.id&&p.period===k}).reduce(function(a,p){return a+ +p.amt},0),bal=r.net-got;
   h+='<div class="card"><div class="row sp"><b>'+short(r.p.s)+' – '+short(r.p.e)+'</b>'+(bal<=0.005?'<span class="tag">✓ Paid</span>':'')+'</div><div class="mu">'+r.n+' shifts · '+r.hrs+' h · net '+m(r.net)+(got?' · received '+m(got):'')+'</div>';
